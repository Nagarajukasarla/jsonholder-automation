name: API Automation Framework

on:
  push:
    branches:
      - master

    pull_request:
      branches:
        - master

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: 17

      - name: Verify Java Version
        run: java --version

      - name: Verify Maven Version
        run: mvn --version

      - name: Verify Docker Version
        run: docker --version

      - name: Build Docker Image
        run: docker build -t api-framework .

      - name: Run API Tests Inside Container
        run: docker run --name api-container api-framework